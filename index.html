<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой сайт</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f2f4f8; color: #222; }
    header { background: #2d3e50; color: white; padding: 25px; text-align: center; }
    nav { display: flex; justify-content: center; gap: 15px; background: #3b5068; padding: 10px; }
    nav a { color: white; text-decoration: none; }
    .card { background: white; margin: 15px; padding: 15px; border-radius: 10px; }
    button { background: #2d3e50; color: white; border: none; padding: 10px 20px; border-radius: 5px; }
    footer { text-align: center; padding: 15px; color: #777; }
  </style>
</head>
<body>
  <header>
    <h1>Мой сайт</h1>
    <p>Лабораторная работа: гибридное мобильное приложение</p>
  </header>
  <nav>
    <a href="#about">Обо мне</a>
    <a href="#projects">Проекты</a>
    <a href="#contacts">Контакты</a>
  </nav>
  <div class="card" id="about">
    <h2>Обо мне</h2>
    <p>Здесь напишите немного о себе.</p>
  </div>
  <div class="card" id="projects">
    <h2>Проекты</h2>
    <p>Здесь опишите свои работы.</p>
  </div>
  <div class="card" id="contacts">
    <h2>Контакты</h2>
    <p>Email: example@mail.com</p>
    <button onclick="alert('Спасибо за интерес')">Связаться</button>
  </div>
  <footer>2026</footer>
</body>
</html>
